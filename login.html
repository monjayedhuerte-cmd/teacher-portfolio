<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edmon Jay Huerte | Secure Portfolio</title>

    <!-- CSS -->
    <link rel="stylesheet" href="Assets/css/login.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Animated Background -->
    <div id="particles-js"></div>

    <!-- Floating Shapes -->
    <div class="floating-shapes">

        <span class="shape shape1"></span>
        <span class="shape shape2"></span>
        <span class="shape shape3"></span>
        <span class="shape shape4"></span>
        <span class="shape shape5"></span>
        <span class="shape shape6"></span>

    </div>

    <!-- Dark Mode Button -->
    <button id="themeToggle" class="theme-btn">

        <i class="fas fa-moon"></i>

    </button>

    <!-- Login Card -->
    <div class="login-card">

        <!-- Profile -->
        <div class="profile">

            <img src="Assets/images/Edmon's Profile Picture.jpg"
                alt="Edmon Jay Huerte">

        </div>

        <!-- Title -->

        <h1>Welcome!</h1>

        <h2>Edmon Jay Huerte</h2>

        <p class="profession">

            Professional Teacher

        </p>

        <p class="description">

            Welcome to my professional teaching portfolio.
            This website contains my teaching experience,
            lesson plans, certifications, trainings,
            classroom achievements, and instructional materials.

        </p>

        <!-- Login Form -->

        <form id="loginForm">

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

                <button
                    type="button"
                    id="togglePassword">

                    <i class="fas fa-eye"></i>

                </button>

            </div>

            <div class="remember">

                <label>

                    <input type="checkbox">

                    Remember this device

                </label>

            </div>

            <button
                class="login-btn"
                type="submit">

                <i class="fas fa-arrow-right"></i>

                Unlock Portfolio

            </button>

            <p id="errorMessage"></p>

        </form>

        <footer>

            © 2026 Edmon Jay Huerte

        </footer>

    </div>

    <!-- Loading Screen -->

    <div id="loadingScreen">

        <div class="loader"></div>

        <h3>Loading Portfolio...</h3>

    </div>

    <!-- Particles -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <!-- JavaScript -->
    <script src="Assets/JS/login.js"></script>

</body>

</html>
